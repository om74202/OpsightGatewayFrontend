name: Build And Upload Frontend and

on:
  push:
    branches:
      - version2
  workflow_dispatch:

jobs:
  build-upload:
    runs-on: ubuntu-latest

    env:
      REACT_APP_API_URL: ${{ secrets.GATEWAY_REACT_APP_API_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug secrets presence
        run: |
          [ -n "${{ secrets.GATEWAY_VM_HOST }}" ] && echo "HOST present" || echo "HOST missing"
          [ -n "${{ secrets.GATEWAY_VM_USER }}" ] && echo "USER present" || echo "USER missing"
          [ -n "${{ secrets.GATEWAY_VM_SSH_KEY }}" ] && echo "SSH KEY present" || echo "SSH KEY missing"
          [ -n "${{ secrets.GATEWAY_REACT_APP_API_URL }}" ] && echo "API URL present" || echo "API URL missing"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Pack artifact
        run: tar -czf frontend-1.0.0.tar.gz build

      - name: Upload artifact to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GATEWAY_VM_HOST }}
          username: ${{ secrets.GATEWAY_VM_USER }}
          key: ${{ secrets.GATEWAY_VM_SSH_KEY }}
          source: "frontend-1.0.0.tar.gz"
          target: "/tmp/v2"
          debug: true